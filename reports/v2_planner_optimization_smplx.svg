<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<style>.bg{fill:#0e1012}.card{fill:#171a1e;stroke:#30343a}.title{fill:#f3f4f6;font:700 34px Arial,sans-serif}.sub{fill:#9ba1aa;font:15px Arial,sans-serif}.label{fill:#a4aab3;font:700 12px Arial,sans-serif;letter-spacing:.5px}.value{fill:#f6f7f8;font:700 34px Arial,sans-serif}.axis{fill:#abb1ba;font:13px Arial,sans-serif}.ok{fill:#57f287;font:700 12px Arial,sans-serif}.note{fill:#858c96;font:12px Arial,sans-serif}.raw{fill:#e9eaec}.accent{fill:#7c5cff}</style>
<rect width="1280" height="720" class="bg"/><rect width="12" height="720" class="accent"/>
<text x="54" y="64" class="title">SKAC v2.1 Planner Optimization / 规划器优化</text>
<text x="54" y="98" class="sub">Vectorized smallest-three quantization + one shared threshold tree</text>
<text x="54" y="124" class="sub">向量化旋转量化 + 多阈值共享关键帧误差树 · high quality · same deterministic output</text>
<rect x="54" y="170" width="556" height="190" rx="14" class="card"/><text x="78" y="207" class="label">SHORTEST · 203 FRAMES</text><text x="78" y="258" class="value">1.74× faster</text><text x="78" y="296" class="sub">Baseline 8.26 s　→　Optimized 4.75 s</text><text x="78" y="330" class="ok">IDENTICAL PLAN SHA-256 / 规划结果一致</text><rect x="646" y="170" width="556" height="190" rx="14" class="card"/><text x="670" y="207" class="label">MEDIAN · 546 FRAMES</text><text x="670" y="258" class="value">1.77× faster</text><text x="670" y="296" class="sub">Baseline 20.10 s　→　Optimized 11.35 s</text><text x="670" y="330" class="ok">IDENTICAL PLAN SHA-256 / 规划结果一致</text>
<text x="54" y="406" class="label">PLANNER TIME / 规划耗时　　WHITE = BASELINE　PURPLE = OPTIMIZED</text>
<text x="54" y="457" class="axis">Shortest</text><rect x="190" y="442" width="337.2" height="22" rx="5" class="raw"/><rect x="190" y="474" width="193.9" height="22" rx="5" class="accent"/><text x="539.2" y="458" class="axis">8.26 s</text><text x="395.9" y="490" class="axis">4.75 s</text><text x="54" y="549" class="axis">Median</text><rect x="190" y="534" width="820.0" height="22" rx="5" class="raw"/><rect x="190" y="566" width="463.2" height="22" rx="5" class="accent"/><text x="1022.0" y="550" class="axis">20.10 s</text><text x="665.2" y="582" class="axis">11.35 s</text>
<text x="54" y="668" class="note">Neutral public SMPL-X parameter streams · offline encode planning only · file I/O excluded</text>
<text x="54" y="692" class="note">公开中性 SMPL-X 参数流 · 仅测离线编码规划 · 不包含文件读取</text>
</svg>