<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<style>.bg{fill:#0e1012}.card{fill:#171a1e;stroke:#30343a}.title{fill:#f3f4f6;font:700 34px Arial,sans-serif}.sub{fill:#9ba1aa;font:15px Arial,sans-serif}.label{fill:#a4aab3;font:700 12px Arial,sans-serif;letter-spacing:.5px}.value{fill:#f6f7f8;font:700 34px Arial,sans-serif}.axis{fill:#abb1ba;font:13px Arial,sans-serif}.ok{fill:#57f287;font:700 12px Arial,sans-serif}.note{fill:#858c96;font:12px Arial,sans-serif}.raw{fill:#e9eaec}.accent{fill:#7c5cff}</style>
<rect width="1280" height="720" class="bg"/><rect width="12" height="720" class="accent"/>
<text x="54" y="64" class="title">SKAC v2.1 Planner Optimization / 规划器优化</text>
<text x="54" y="98" class="sub">Shared error tree + candidate cache + normalized quaternion reuse</text>
<text x="54" y="124" class="sub">共享误差树 + 候选缓存 + 四元数归一化复用 · high quality · median of repeated runs</text>
<rect x="54" y="170" width="556" height="190" rx="14" class="card"/><text x="78" y="207" class="label">SHORTEST · 203 FRAMES</text><text x="78" y="258" class="value">2.48× faster</text><text x="78" y="296" class="sub">Baseline 7.64 s　→　Optimized 3.07 s</text><text x="78" y="330" class="ok">IDENTICAL PLAN SHA-256 / 规划结果一致</text><rect x="646" y="170" width="556" height="190" rx="14" class="card"/><text x="670" y="207" class="label">MEDIAN · 546 FRAMES</text><text x="670" y="258" class="value">2.70× faster</text><text x="670" y="296" class="sub">Baseline 18.06 s　→　Optimized 6.69 s</text><text x="670" y="330" class="ok">IDENTICAL PLAN SHA-256 / 规划结果一致</text>
<text x="54" y="406" class="label">PLANNER TIME / 规划耗时　　WHITE = BASELINE　PURPLE = OPTIMIZED</text>
<text x="54" y="457" class="axis">Shortest</text><rect x="190" y="442" width="346.8" height="22" rx="5" class="raw"/><rect x="190" y="474" width="139.6" height="22" rx="5" class="accent"/><text x="548.8" y="458" class="axis">7.64 s</text><text x="341.6" y="490" class="axis">3.07 s</text><text x="54" y="549" class="axis">Median</text><rect x="190" y="534" width="820.0" height="22" rx="5" class="raw"/><rect x="190" y="566" width="303.8" height="22" rx="5" class="accent"/><text x="1022.0" y="550" class="axis">18.06 s</text><text x="505.8" y="582" class="axis">6.69 s</text>
<text x="54" y="668" class="note">Neutral public SMPL-X parameter streams · offline encode planning only · file I/O excluded</text>
<text x="54" y="692" class="note">公开中性 SMPL-X 参数流 · 仅测离线编码规划 · 不包含文件读取</text>
