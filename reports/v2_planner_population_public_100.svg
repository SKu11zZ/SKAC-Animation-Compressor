<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<style>.bg{fill:#0e1012}.accent{fill:#25e6c8}.title{fill:#f4f5f6;font:700 34px Arial,sans-serif}.sub{fill:#989fa8;font:15px Arial,sans-serif}.card{fill:#171a1e;stroke:#30343a}.value{fill:#f4f5f6;font:700 30px Arial,sans-serif}.label{fill:#9fa6af;font:700 12px Arial,sans-serif}.head{fill:#25e6c8;font:700 12px Arial,sans-serif}.row{fill:#d8dbe0;font:14px Arial,sans-serif}.number{fill:#f4f5f6;font:13px Arial,sans-serif;text-anchor:end}.note{fill:#858c96;font:12px Arial,sans-serif}</style>
<rect width="1280" height="720" class="bg"/><rect width="12" height="720" class="accent"/>
<text x="54" y="64" class="title">SKAC v2.1 Population Calibration / 人口分布校准</text>
<text x="54" y="98" class="sub">Deterministic duration-stratified public parameter streams · center window · high quality</text>
<rect x="54" y="140" width="360" height="110" rx="14" class="card"/><text x="78" y="174" class="label">SAMPLES / 样本</text><text x="78" y="222" class="value">100</text>
<rect x="438" y="140" width="360" height="110" rx="14" class="card"/><text x="462" y="174" class="label">QUALITY COVERAGE / 质量覆盖率</text><text x="462" y="222" class="value">100.0%</text>
<rect x="822" y="140" width="380" height="110" rx="14" class="card"/><text x="846" y="174" class="label">EVALUATED FRAMES / 评测帧数</text><text x="846" y="222" class="value">43,414</text>
<text x="550" y="286" class="head" text-anchor="end">P50</text><text x="760" y="286" class="head" text-anchor="end">P80</text><text x="970" y="286" class="head" text-anchor="end">P95</text><text x="1160" y="286" class="head" text-anchor="end">MAX / 最差</text>
<text x="54" y="330" class="row">Planner time / 规划耗时</text><text x="550" y="330" class="number">6180.8798 ms</text><text x="760" y="330" class="number">6868.8927 ms</text><text x="970" y="330" class="number">7392.1678 ms</text><text x="1160" y="330" class="number">8189.2941 ms</text><text x="54" y="398" class="row">Pre-entropy payload / 熵编码前载荷</text><text x="550" y="398" class="number">19.6469 %</text><text x="760" y="398" class="number">20.4440 %</text><text x="970" y="398" class="number">20.9488 %</text><text x="1160" y="398" class="number">21.4194 %</text><text x="54" y="466" class="row">Rotation error / 旋转误差</text><text x="550" y="466" class="number">0.0475 °</text><text x="760" y="466" class="number">0.0493 °</text><text x="970" y="466" class="number">0.0504 °</text><text x="1160" y="466" class="number">0.0511 °</text><text x="54" y="534" class="row">Global error / 全局误差</text><text x="550" y="534" class="number">0.0006 height</text><text x="760" y="534" class="number">0.0007 height</text><text x="970" y="534" class="number">0.0008 height</text><text x="1160" y="534" class="number">0.0009 height</text>
<text x="54" y="650" class="note">Payload percentage is a planner estimate before entropy coding and container overhead; it is not the final .skac file size.</text>
<text x="54" y="676" class="note">载荷占比为熵编码和容器开销之前的规划估算，不代表最终 .skac 文件体积。每条结果使用中性 ID，报告不包含源路径。</text>
</svg>