<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="586" viewBox="0 0 1280 586">
<style>
text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#141414}
.title{font-size:32px;font-weight:700}.sub{font-size:14px;fill:#686868}
.value{font-size:25px;font-weight:700}.label{font-size:12px;fill:#666}
.row{font-size:12px}.small{font-size:11px;fill:#737373}
</style>
<rect width="1280" height="586" fill="#f5f4f0"/>
<text x="52" y="58" class="title">SKAC v2 Perceptual Plan / 感知规划</text>
<text x="52" y="86" class="sub">Deterministic planning only · no model required · high quality</text>
<rect x="1084" y="36" width="144" height="42" rx="21" fill="#ff5c35"/>
<text x="1156" y="62" text-anchor="middle" font-size="13" font-weight="700" style="fill:#fff">PASS / 通过</text>
<rect x="52" y="116" width="270" height="102" rx="12" fill="#fff" stroke="#d8d5cf"/>
<text x="72" y="160" class="value">4</text>
<text x="72" y="190" class="label">Segments / 分段</text>
<rect x="346" y="116" width="270" height="102" rx="12" fill="#fff" stroke="#d8d5cf"/>
<text x="366" y="160" class="value">12.31</text>
<text x="366" y="190" class="label">Mean bits / 平均位宽</text>
<rect x="640" y="116" width="270" height="102" rx="12" fill="#fff" stroke="#d8d5cf"/>
<text x="660" y="160" class="value">336</text>
